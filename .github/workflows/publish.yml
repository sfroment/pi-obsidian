name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this publish is being triggered manually"
        required: false
        default: "manual trigger"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Node for npm publish
        uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-obsidian-build.js

      - name: Check NPM_TOKEN is set
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN secret is not set. Add it via:" 
          echo "  gh secret set NPM_TOKEN --repo sfroment/pi-obsidian"
          echo "or repo Settings > Secrets and variables > Actions > New repository secret."
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
